name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build blog, sitemap and llms.txt
        run: |
          pip install markdown pillow
          python tools/build_blog.py
          python tools/build_services.py
          python tools/sitemap_lastmod.py
          python tools/apply_header.py
          python tools/apply_footer.py
          python tools/optimize_images.py
          python tools/harden.py
      - name: Stage only public files into _site
        run: |
          mkdir _site
          tar -cf - --exclude=./.git --exclude=./.github --exclude=./_site --exclude=./tools \
            --exclude=./v1 --exclude=./v2 --exclude=./blog/posts \
            --exclude='*.py' --exclude='*.pyc' --exclude=__pycache__ \
            --exclude=./.gitignore --exclude='*.md' --exclude=.DS_Store . | tar -xf - -C _site
          test -f _site/index.html && test -f _site/llms.txt && test -f _site/CNAME
          ! test -e _site/tools
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow (Bing, Copilot, Yandex)
        run: |
          sleep 30
          python tools/indexnow.py
